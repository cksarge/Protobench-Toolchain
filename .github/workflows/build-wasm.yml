name: build-wasm
# Builds the in-browser Arduino toolchain (avr-gcc + binutils → WebAssembly) and its sysroot.
# Pushing a tag like `avr-7.3.0-pb1` publishes a GitHub Release with the binaries AND the
# complete corresponding source (GNU tarballs, our build scripts and patches, the Arduino
# core and library sources), as the GPL/LGPL require.
on:
  push:
    tags: ["avr-*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  EMSDK_VERSION: 6.0.12
  ARDUINO_CLI_VERSION: 1.5.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Arduino toolchain, core and libraries (for the sysroot)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/arduino/arduino-cli/v${ARDUINO_CLI_VERSION}/install.sh" | BINDIR="$HOME/.local/bin" sh -s "$ARDUINO_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install "Servo@1.3.0" "LiquidCrystal@1.0.7" "Stepper@1.1.3" \
            "Adafruit GFX Library@1.12.6" "Adafruit BusIO@1.17.4" "Adafruit SSD1306@2.5.17" "TM1637@1.2.0" "LedControl@1.0.6" \
            "DHT sensor library@1.4.7" "Adafruit Unified Sensor@1.1.15" "Adafruit NeoPixel@1.15.5" "OneWire@2.3.8" "DallasTemperature@4.0.6"

      - name: Fetch and patch GNU sources (checksums verified)
        run: wasm/fetch.sh && wasm/patch-sources.sh

      - name: Build as, ld, cc1, cc1plus to WebAssembly
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          CC_FOR_BUILD=gcc CXX_FOR_BUILD=g++ wasm/build-tools.sh

      - name: Build the sysroot (headers, libc, prebuilt core and libraries)
        run: wasm/build-sysroot.sh

      - name: Corresponding source
        run: |
          D=wasm/build/dist
          tar czf "$D/source-gnu-toolchain.tar.gz" -C wasm/build/src $(cd wasm/build/src && ls *.tar.*) -C "$GITHUB_WORKSPACE" wasm/*.sh LICENSE
          DATA="$(arduino-cli config get directories.data)"; USERDIR="$(arduino-cli config get directories.user)"
          tar czf "$D/source-arduino-core-and-libraries.tar.gz" -C "$DATA/packages/arduino/hardware/avr" 1.8.8 -C "$USERDIR" libraries -C "$GITHUB_WORKSPACE/server" libraries
          cat > "$D/SOURCES.md" <<'EOF'
          Corresponding source for this release:
          - source-gnu-toolchain.tar.gz: GNU binutils, GCC, GMP, MPFR and MPC exactly as built, plus the build scripts and patches.
          - source-arduino-core-and-libraries.tar.gz: the Arduino AVR core and the libraries compiled into the sysroot.
          - avr-libc and libgcc in the sysroot are the unmodified builds from Arduino's avr-gcc 7.3.0-atmel3.6.1-arduino7 package
            (sources: https://github.com/arduino/toolchain-avr).
          EOF
          (cd "$D" && rm -rf ldscripts && sha256sum * > SHA256SUMS && ls -la)

      - uses: actions/upload-artifact@v4
        with:
          name: avr-wasm-toolchain
          path: wasm/build/dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/avr-')
        uses: softprops/action-gh-release@v2
        with:
          files: wasm/build/dist/*
          body_path: wasm/build/dist/SOURCES.md
